<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Video Editor Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムスクロールバー（ダークテーマ用） */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
        
        /* タイムラインのレイヤートラック用のスタイル */
        .timeline-track {
            background-image: linear-gradient(to right, #374151 1px, transparent 1px);
            background-size: 50px 100%;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- ヘッダー -->
    <header class="bg-gray-800 border-b border-gray-700 h-14 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
            <div class="w-3 h-3 rounded-full bg-green-500"></div>
            <h1 class="ml-4 font-bold text-lg tracking-wider text-gray-200">Web Video Editor <span class="text-xs text-gray-400 font-normal">Prototype</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="status-text" class="text-sm text-green-400 mr-4"></span>
            <button id="btn-export" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-md text-sm font-medium transition-colors flex items-center gap-2 shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                動画を保存 (WebM)
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- 左側：プレビュー & コントロール -->
        <section class="flex-1 flex flex-col border-r border-gray-700 bg-gray-950">
            <!-- キャンバスエリア -->
            <div class="flex-1 p-4 flex items-center justify-center overflow-hidden relative">
                <!-- 動画描画用キャンバス（内部解像度は1920x1080などに固定し、CSSで表示サイズを調整） -->
                <canvas id="preview-canvas" width="1280" height="720" class="w-full max-w-full max-h-full object-contain bg-black shadow-2xl rounded-md border border-gray-800"></canvas>
            </div>
            
            <!-- コントロールバー -->
            <div class="bg-gray-800 border-t border-gray-700 p-3 shrink-0 flex flex-col gap-2">
                <!-- シークバー (プロトタイプでは動画全体の進行度) -->
                <div class="flex items-center gap-2">
                    <span id="time-current" class="text-xs font-mono text-gray-400 w-12 text-right">00:00</span>
                    <input type="range" id="seek-bar" min="0" max="100" value="0" class="flex-1 h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                    <span id="time-total" class="text-xs font-mono text-gray-400 w-12">00:00</span>
                </div>
                
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <button id="btn-play" class="p-2 bg-gray-700 hover:bg-gray-600 rounded-full transition-colors" title="再生">
                            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        </button>
                        <button id="btn-pause" class="p-2 bg-gray-700 hover:bg-gray-600 rounded-full transition-colors hidden" title="一時停止">
                            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        </button>
                        <button id="btn-stop" class="p-2 bg-gray-700 hover:bg-gray-600 rounded-full transition-colors" title="停止">
                            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <label class="text-xs text-gray-400">再生スピード:</label>
                        <input type="range" id="speed-slider" min="0.25" max="3" step="0.25" value="1" class="w-24 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                        <span id="speed-value" class="text-xs font-mono text-gray-300 w-8">1.0x</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 右側：プロパティ（インスペクタ） -->
        <aside class="w-80 bg-gray-800 flex flex-col shrink-0">
            <div class="p-3 border-b border-gray-700 bg-gray-850">
                <h2 class="text-sm font-bold text-gray-300">プロパティ (選択中のレイヤー)</h2>
            </div>
            
            <div id="properties-panel" class="p-4 flex-1 overflow-y-auto space-y-4">
                <div id="no-selection-msg" class="text-sm text-gray-500 text-center mt-10">
                    レイヤーが選択されていません
                </div>
                
                <!-- テキストレイヤー用設定（JSで表示切り替え） -->
                <div id="text-properties" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">テキスト内容</label>
                        <textarea id="prop-text-content" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">フォント</label>
                            <select id="prop-font-family" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-sm text-white focus:outline-none">
                                <option value="sans-serif">ゴシック体</option>
                                <option value="serif">明朝体</option>
                                <option value="monospace">等幅</option>
                                <option value="Impact">Impact</option>
                                <option value="Comic Sans MS">Comic Sans</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">サイズ</label>
                            <input type="number" id="prop-font-size" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-sm text-white focus:outline-none" value="48">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">文字色</label>
                        <div class="flex items-center gap-2">
                            <input type="color" id="prop-color" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0 p-0">
                            <input type="text" id="prop-color-text" class="flex-1 bg-gray-900 border border-gray-700 rounded p-1.5 text-sm text-white" value="#ffffff">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">位置 X</label>
                            <input type="number" id="prop-pos-x" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-sm text-white" value="640">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">位置 Y</label>
                            <input type="number" id="prop-pos-y" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-sm text-white" value="360">
                        </div>
                    </div>
                </div>

                <!-- メディアレイヤー用設定 -->
                <div id="media-properties" class="hidden space-y-4">
                     <div>
                        <label class="block text-xs text-gray-400 mb-1">ファイル名</label>
                        <input type="text" id="prop-media-name" disabled class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-sm text-gray-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">スケール (%)</label>
                            <input type="number" id="prop-media-scale" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-sm text-white" value="100">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">位置 X</label>
                            <input type="number" id="prop-media-x" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-sm text-white" value="0">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">位置 Y</label>
                            <input type="number" id="prop-media-y" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-sm text-white" value="0">
                        </div>
                    </div>
                </div>

            </div>
        </aside>

    </main>

    <!-- タイムライン / レイヤー -->
    <footer class="h-64 bg-gray-900 border-t border-gray-700 flex flex-col shrink-0">
        <!-- タイムラインツールバー -->
        <div class="bg-gray-800 p-2 flex items-center gap-2 border-b border-gray-700">
            <button id="btn-add-text" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-sm text-white transition-colors flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>
                テキスト追加
            </button>
            <div class="relative">
                <input type="file" id="file-import" accept="video/*,image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <button class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded text-sm text-white transition-colors flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    メディア読み込み
                </button>
            </div>
            <button id="btn-delete-layer" class="px-3 py-1.5 bg-red-900/50 hover:bg-red-800/80 text-red-200 rounded text-sm transition-colors ml-auto">
                削除
            </button>
        </div>

        <!-- タイムライントラックエリア -->
        <div class="flex-1 flex overflow-hidden">
            <!-- レイヤーヘッダー -->
            <div class="w-48 bg-gray-800 border-r border-gray-700 flex flex-col overflow-y-auto" id="layer-headers">
                <!-- JSで動的に追加 -->
            </div>
            <!-- トラック（ブロック表示） -->
            <div class="flex-1 bg-gray-900 overflow-auto relative timeline-track" id="timeline-tracks">
                <!-- 時間軸の目盛り（簡易） -->
                <div class="h-6 border-b border-gray-700 sticky top-0 bg-gray-800/90 z-10 flex text-[10px] text-gray-500 items-center pl-2" id="time-ruler">
                    <!-- CSSの背景で代用し、ここではシークバーの線のみ -->
                </div>
                <!-- 再生ヘッド線 -->
                <div id="playhead" class="absolute top-0 bottom-0 w-px bg-red-500 z-20 pointer-events-none" style="left: 0%;"></div>
                
                <!-- トラックコンテナ (JSで動的に追加) -->
                <div id="tracks-container" class="relative">
                </div>
            </div>
        </div>
    </footer>

    <!-- アプリケーションロジック -->
    <script>
        /**
         * State & Configuration
         */
        const AppState = {
            canvasWidth: 1280,
            canvasHeight: 720,
            layers: [], // 各レイヤーオブジェクトを格納
            selectedLayerId: null,
            currentTime: 0, // 秒
            duration: 10, // デフォルト10秒。動画読み込み時に拡張
            isPlaying: false,
            playbackRate: 1.0,
            animationFrameId: null,
            nextLayerId: 1,
            
            // 録画用
            mediaRecorder: null,
            recordedChunks: [],
            isRecording: false
        };

        // DOM Elements
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        const fileImport = document.getElementById('file-import');
        
        // Controls
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const speedSlider = document.getElementById('speed-slider');
        const speedValue = document.getElementById('speed-value');
        const seekBar = document.getElementById('seek-bar');
        const timeCurrentText = document.getElementById('time-current');
        const timeTotalText = document.getElementById('time-total');
        
        // Properties Panel
        const noSelectionMsg = document.getElementById('no-selection-msg');
        const textProps = document.getElementById('text-properties');
        const mediaProps = document.getElementById('media-properties');
        
        // Timeline
        const layerHeaders = document.getElementById('layer-headers');
        const tracksContainer = document.getElementById('tracks-container');
        const playhead = document.getElementById('playhead');

        /**
         * Core Rendering Loop
         */
        let lastTime = 0;
        function renderLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const deltaTime = (timestamp - lastTime) / 1000; // 秒に変換
            lastTime = timestamp;

            if (AppState.isPlaying && !AppState.isRecording) {
                AppState.currentTime += deltaTime * AppState.playbackRate;
                if (AppState.currentTime >= AppState.duration) {
                    AppState.currentTime = AppState.duration;
                    stopPlayback();
                }
                updateUIForTime();
            }

            drawCanvas();
            AppState.animationFrameId = requestAnimationFrame(renderLoop);
        }

        function drawCanvas() {
            // 背景クリア
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, AppState.canvasWidth, AppState.canvasHeight);

            // Zインデックス順（配列の逆順または下から）に描画
            // 今回は配列の後ろのものが上（前面）に描画される標準的な仕組み
            AppState.layers.forEach(layer => {
                // 時間の範囲内かチェック (プロトタイプでは常に表示とする簡易版も可だが、いちおう時間制御のモックをいれる)
                // 単純化のため、プロトタイプでは動画レイヤーは常にアクティブとして扱う。
                
                if (layer.type === 'video' && layer.element) {
                    // ビデオの再生位置をアプリの時間と同期
                    // 注意: 頻繁なcurrentTimeの更新はブラウザによってパフォーマンスが落ちる。
                    // 再生中はブラウザに任せ、シーク時のみ更新するアプローチもあるが、ここでは簡易同期。
                    if (Math.abs(layer.element.currentTime - AppState.currentTime) > 0.1 && !AppState.isPlaying) {
                        layer.element.currentTime = AppState.currentTime;
                    }
                    
                    try {
                        const w = layer.element.videoWidth * (layer.scale / 100);
                        const h = layer.element.videoHeight * (layer.scale / 100);
                        ctx.drawImage(layer.element, layer.x, layer.y, w, h);
                    } catch (e) { /* ignore ready state errors */ }
                } 
                else if (layer.type === 'image' && layer.element) {
                     const w = layer.element.width * (layer.scale / 100);
                     const h = layer.element.height * (layer.scale / 100);
                     ctx.drawImage(layer.element, layer.x, layer.y, w, h);
                }
                else if (layer.type === 'text') {
                    ctx.font = `${layer.size}px "${layer.font}"`;
                    ctx.fillStyle = layer.color;
                    ctx.textBaseline = 'top';
                    
                    // 複数行対応
                    const lines = layer.text.split('\n');
                    lines.forEach((line, index) => {
                        ctx.fillText(line, layer.x, layer.y + (index * layer.size * 1.2));
                    });
                }
            });
        }

        /**
         * Playback Controls
         */
        function togglePlay() {
            if (AppState.isPlaying) {
                // Pause
                AppState.isPlaying = false;
                btnPlay.classList.remove('hidden');
                btnPause.classList.add('hidden');
                // pause all videos
                AppState.layers.filter(l => l.type === 'video').forEach(l => l.element.pause());
            } else {
                // Play
                if (AppState.currentTime >= AppState.duration) AppState.currentTime = 0;
                AppState.isPlaying = true;
                lastTime = performance.now();
                btnPlay.classList.add('hidden');
                btnPause.classList.remove('hidden');
                
                // play all videos
                AppState.layers.filter(l => l.type === 'video').forEach(l => {
                    l.element.playbackRate = AppState.playbackRate;
                    l.element.play().catch(e=>console.log(e));
                });
            }
        }

        function stopPlayback() {
            AppState.isPlaying = false;
            AppState.currentTime = 0;
            btnPlay.classList.remove('hidden');
            btnPause.classList.add('hidden');
            updateUIForTime();
            AppState.layers.filter(l => l.type === 'video').forEach(l => {
                l.element.pause();
                l.element.currentTime = 0;
            });
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateUIForTime() {
            timeCurrentText.innerText = formatTime(AppState.currentTime);
            timeTotalText.innerText = formatTime(AppState.duration);
            
            // シークバーの更新 (0-100)
            if (AppState.duration > 0) {
                seekBar.value = (AppState.currentTime / AppState.duration) * 100;
                playhead.style.left = `${seekBar.value}%`;
            }
        }

        // イベントリスナー: コントロール
        btnPlay.addEventListener('click', togglePlay);
        btnPause.addEventListener('click', togglePlay);
        btnStop.addEventListener('click', stopPlayback);
        
        speedSlider.addEventListener('input', (e) => {
            AppState.playbackRate = parseFloat(e.target.value);
            speedValue.innerText = AppState.playbackRate.toFixed(1) + 'x';
            // 実行中の動画にも反映
            AppState.layers.filter(l => l.type === 'video').forEach(l => {
                l.element.playbackRate = AppState.playbackRate;
            });
        });

        seekBar.addEventListener('input', (e) => {
            const percent = parseFloat(e.target.value);
            AppState.currentTime = (percent / 100) * AppState.duration;
            updateUIForTime();
            // 動画の現在位置を更新（再生中なら一時停止してシークするのが安全だが簡易実装）
            AppState.layers.filter(l => l.type === 'video').forEach(l => {
                l.element.currentTime = AppState.currentTime;
            });
            drawCanvas(); // 即座に描画更新
        });

        /**
         * Layer Management & Timeline
         */
        function addTextLayer() {
            const newLayer = {
                id: AppState.nextLayerId++,
                type: 'text',
                name: 'テキストレイヤー',
                text: 'サンプルテキスト',
                font: 'sans-serif',
                size: 64,
                color: '#ffffff',
                x: AppState.canvasWidth / 2 - 100,
                y: AppState.canvasHeight / 2 - 30
            };
            AppState.layers.push(newLayer);
            selectLayer(newLayer.id);
            renderTimeline();
        }

        function handleFileImport(e) {
            const files = e.target.files;
            if (!files.length) return;

            Array.from(files).forEach(file => {
                const url = URL.createObjectURL(file);
                if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.src = url;
                    video.muted = true; // プロトタイプのためオーディオ制御を簡略化
                    video.onloadedmetadata = () => {
                        // 動画の長さに合わせて全体のデュレーションを拡張
                        if (video.duration > AppState.duration) {
                            AppState.duration = video.duration;
                            updateUIForTime();
                        }
                        const newLayer = {
                            id: AppState.nextLayerId++,
                            type: 'video',
                            name: file.name,
                            element: video,
                            x: 0, y: 0, scale: 100
                        };
                        AppState.layers.push(newLayer);
                        selectLayer(newLayer.id);
                        renderTimeline();
                    };
                } else if (file.type.startsWith('image/')) {
                    const img = new Image();
                    img.onload = () => {
                        const newLayer = {
                            id: AppState.nextLayerId++,
                            type: 'image',
                            name: file.name,
                            element: img,
                            x: 0, y: 0, scale: 100
                        };
                        AppState.layers.push(newLayer);
                        selectLayer(newLayer.id);
                        renderTimeline();
                    };
                    img.src = url;
                }
            });
            e.target.value = ''; // リセット
        }

        document.getElementById('btn-add-text').addEventListener('click', addTextLayer);
        fileImport.addEventListener('change', handleFileImport);
        
        document.getElementById('btn-delete-layer').addEventListener('click', () => {
            if (AppState.selectedLayerId !== null) {
                AppState.layers = AppState.layers.filter(l => l.id !== AppState.selectedLayerId);
                AppState.selectedLayerId = null;
                updatePropertiesPanel();
                renderTimeline();
            }
        });

        function renderTimeline() {
            layerHeaders.innerHTML = '';
            tracksContainer.innerHTML = '';

            // 逆順で表示（上が前面）
            [...AppState.layers].reverse().forEach(layer => {
                // ヘッダー
                const headerDiv = document.createElement('div');
                headerDiv.className = `h-10 px-2 flex items-center border-b border-gray-700 cursor-pointer hover:bg-gray-700 text-sm truncate ${layer.id === AppState.selectedLayerId ? 'bg-gray-700 text-blue-400 font-bold' : 'text-gray-300'}`;
                headerDiv.innerText = layer.name;
                headerDiv.onclick = () => selectLayer(layer.id);
                
                // アイコン追加
                const icon = document.createElement('span');
                icon.className = 'mr-2 text-xs opacity-70';
                icon.innerText = layer.type === 'text' ? 'T' : (layer.type === 'video' ? '🎬' : '🖼️');
                headerDiv.prepend(icon);
                
                layerHeaders.appendChild(headerDiv);

                // トラック（ブロック表示。簡易的に全期間表示）
                const trackRow = document.createElement('div');
                trackRow.className = 'h-10 border-b border-gray-700/50 flex items-center relative';
                
                const block = document.createElement('div');
                block.className = `h-6 rounded mx-1 absolute ${layer.type === 'text' ? 'bg-blue-600/80' : 'bg-green-600/80'}`;
                block.style.left = '0%';
                block.style.width = '100%'; // 全体幅。時間制御実装時は調整
                block.style.boxShadow = layer.id === AppState.selectedLayerId ? '0 0 0 2px #fff' : 'none';
                
                trackRow.appendChild(block);
                tracksContainer.appendChild(trackRow);
            });
        }

        function selectLayer(id) {
            AppState.selectedLayerId = id;
            renderTimeline();
            updatePropertiesPanel();
        }

        /**
         * Properties Panel Integration
         */
        function updatePropertiesPanel() {
            const layer = AppState.layers.find(l => l.id === AppState.selectedLayerId);
            
            noSelectionMsg.classList.add('hidden');
            textProps.classList.add('hidden');
            mediaProps.classList.add('hidden');

            if (!layer) {
                noSelectionMsg.classList.remove('hidden');
                return;
            }

            if (layer.type === 'text') {
                textProps.classList.remove('hidden');
                document.getElementById('prop-text-content').value = layer.text;
                document.getElementById('prop-font-family').value = layer.font;
                document.getElementById('prop-font-size').value = layer.size;
                document.getElementById('prop-color').value = layer.color;
                document.getElementById('prop-color-text').value = layer.color;
                document.getElementById('prop-pos-x').value = layer.x;
                document.getElementById('prop-pos-y').value = layer.y;
            } else {
                mediaProps.classList.remove('hidden');
                document.getElementById('prop-media-name').value = layer.name;
                document.getElementById('prop-media-scale').value = layer.scale;
                document.getElementById('prop-media-x').value = layer.x;
                document.getElementById('prop-media-y').value = layer.y;
            }
        }

        // イベントリスナー: テキストプロパティ更新
        document.getElementById('prop-text-content').addEventListener('input', (e) => updateLayerProp('text', e.target.value));
        document.getElementById('prop-font-family').addEventListener('change', (e) => updateLayerProp('font', e.target.value));
        document.getElementById('prop-font-size').addEventListener('input', (e) => updateLayerProp('size', parseInt(e.target.value) || 10));
        document.getElementById('prop-color').addEventListener('input', (e) => {
            document.getElementById('prop-color-text').value = e.target.value;
            updateLayerProp('color', e.target.value);
        });
        document.getElementById('prop-color-text').addEventListener('input', (e) => {
            document.getElementById('prop-color').value = e.target.value;
            updateLayerProp('color', e.target.value);
        });
        document.getElementById('prop-pos-x').addEventListener('input', (e) => updateLayerProp('x', parseInt(e.target.value) || 0));
        document.getElementById('prop-pos-y').addEventListener('input', (e) => updateLayerProp('y', parseInt(e.target.value) || 0));

        // メディアプロパティ更新
        document.getElementById('prop-media-scale').addEventListener('input', (e) => updateLayerProp('scale', parseInt(e.target.value) || 100));
        document.getElementById('prop-media-x').addEventListener('input', (e) => updateLayerProp('x', parseInt(e.target.value) || 0));
        document.getElementById('prop-media-y').addEventListener('input', (e) => updateLayerProp('y', parseInt(e.target.value) || 0));

        function updateLayerProp(key, value) {
            const layer = AppState.layers.find(l => l.id === AppState.selectedLayerId);
            if (layer) {
                layer[key] = value;
                drawCanvas(); // 即座に反映
            }
        }

        /**
         * Export / Recording (MediaRecorder API)
         */
        const btnExport = document.getElementById('btn-export');
        const statusText = document.getElementById('status-text');

        btnExport.addEventListener('click', async () => {
            if (AppState.layers.length === 0) return;
            
            // 録画準備
            AppState.isRecording = true;
            stopPlayback(); // 一旦停止して0に戻す
            AppState.currentTime = 0;
            
            const stream = canvas.captureStream(30); // 30fps
            const options = { mimeType: 'video/webm; codecs=vp9' };
            
            try {
                AppState.mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                AppState.mediaRecorder = new MediaRecorder(stream); // フォールバック
            }

            AppState.recordedChunks = [];
            AppState.mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) AppState.recordedChunks.push(e.data);
            };

            AppState.mediaRecorder.onstop = () => {
                const blob = new Blob(AppState.recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'output.webm';
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);
                
                AppState.isRecording = false;
                btnExport.disabled = false;
                btnExport.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> 動画を保存 (WebM)';
                statusText.innerText = "書き出し完了！";
                setTimeout(() => statusText.innerText = "", 3000);
            };

            // UI更新
            btnExport.disabled = true;
            btnExport.innerHTML = '<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 書き出し中...';
            statusText.innerText = "";

            // 動画再生の準備
            AppState.layers.filter(l => l.type === 'video').forEach(l => {
                l.element.playbackRate = 1.0;
                l.element.currentTime = 0;
            });

            // 録画開始
            AppState.mediaRecorder.start();
            
            // 録画用のアニメーションループ (等速で処理)
            const fps = 30;
            const frameTime = 1000 / fps;
            let exportTime = 0;

            function exportFrame() {
                if (exportTime >= AppState.duration) {
                    AppState.mediaRecorder.stop();
                    return;
                }
                
                AppState.currentTime = exportTime;
                
                // 動画を同期
                AppState.layers.filter(l => l.type === 'video').forEach(l => {
                    if (l.element.currentTime < exportTime) {
                         // 強制的に進める（実際はPlayした状態で回す方が滑らかですが、プロトタイプとしてはこれで描画します）
                         l.element.currentTime = exportTime;
                    }
                });

                drawCanvas();
                updateUIForTime();
                
                exportTime += (1 / fps);
                setTimeout(exportFrame, frameTime);
            }
            
            exportFrame();
        });


        // 初期化
        updateUIForTime();
        renderLoop(performance.now()); // ループ開始
        
    </script>
</body>
</html>
