<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini風 Vanilla AI</title>
    <style>
        :root {
            --bg-color: #f0f4f9;
            --chat-bg: #ffffff;
            --user-color: #d3e3fd;
            --user-text: #041e49;
            --ai-color: #f0f4f9;
            --ai-text: #1f1f1f;
            --border: #e0e0e0;
            --accent: #0b57d0;
        }
        body {
            font-family: "Google Sans", -apple-system, sans-serif;
            background: #e8eaed; margin: 0; display: flex; 
            justify-content: center; align-items: center; height: 100vh;
        }
        .app-container {
            width: 100%; max-width: 600px; height: 95vh;
            background: var(--chat-bg); border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .header {
            padding: 20px; text-align: center; font-size: 1.2em; font-weight: bold;
            color: var(--ai-text); border-bottom: 1px solid var(--border);
        }
        .status { font-size: 0.7em; color: #188038; font-weight: normal; display: block; margin-top: 5px;}
        
        .chat-window {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
            background: var(--chat-bg);
        }
        
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.ai { align-self: flex-start; align-items: flex-start; }

        .message {
            padding: 14px 18px; border-radius: 20px; font-size: 0.95em; line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .user-msg { background: var(--user-color); color: var(--user-text); border-bottom-right-radius: 4px; }
        .ai-msg { background: var(--ai-color); color: var(--ai-text); border-bottom-left-radius: 4px; }
        
        /* 評価ボタン群 */
        .feedback-actions {
            display: flex; gap: 10px; margin-top: 6px; padding-left: 10px;
        }
        .feedback-btn {
            background: none; border: none; font-size: 1.1em; cursor: pointer;
            color: #5f6368; padding: 4px; border-radius: 50%; transition: 0.2s;
        }
        .feedback-btn:hover { background: #e8eaed; transform: scale(1.1); }
        .feedback-btn.active-good { color: #188038; background: #e6f4ea; }
        .feedback-btn.active-bad { color: #d93025; background: #fce8e6; }

        /* AIが間違えた時にサッと教える入力欄 */
        .correction-input {
            display: none; margin-top: 8px; width: 100%; gap: 8px;
            animation: fadeIn 0.2s ease;
        }
        .correction-input.active { display: flex; }
        .correction-input input {
            flex: 1; padding: 8px 12px; border: 1px solid var(--border);
            border-radius: 16px; font-size: 0.85em; outline: none;
        }
        .correction-input button {
            background: var(--accent); color: white; border: none;
            padding: 8px 12px; border-radius: 16px; cursor: pointer; font-size: 0.85em;
        }

        .input-area { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .input-area input {
            flex: 1; padding: 15px; border: 1px solid var(--border);
            border-radius: 30px; font-size: 1em; outline: none; transition: 0.2s;
            background: var(--bg-color);
        }
        .input-area input:focus { background: white; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(11,87,208,0.2); }
        .btn-send {
            background: var(--accent); color: white; border: none; border-radius: 50%;
            width: 50px; height: 50px; font-size: 1.2em; cursor: pointer; display: flex;
            justify-content: center; align-items: center; transition: 0.2s;
        }
        .btn-send:hover { background: #0842a0; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        Vanilla AI (RLHF Edition)
        <span class="status" id="statusText">● 待機中</span>
    </div>
    
    <div class="chat-window" id="chatWindow">
        <!-- 会話がここに追加される -->
    </div>
    
    <div class="input-area">
        <input type="text" id="chatInput" placeholder="メッセージを入力..." autocomplete="off">
        <button class="btn-send" id="sendBtn">➤</button>
    </div>
</div>

<script>
// --- RNN モデル (前回と同じ、Vanilla JSでの行列計算) ---
class ChatRNN {
    constructor(inputSize, hiddenSize, outputSize, learningRate = 0.1) {
        this.inputSize = inputSize; this.hiddenSize = hiddenSize; this.outputSize = outputSize;
        this.learningRate = learningRate;
        this.w1 = this.initWeights(inputSize + hiddenSize, hiddenSize);
        this.w2 = this.initWeights(hiddenSize, outputSize);
        this.b1 = new Array(hiddenSize).fill(0); this.b2 = new Array(outputSize).fill(0);
        this.context = new Array(hiddenSize).fill(0);
    }
    initWeights(inSize, outSize) {
        let w = [];
        for (let i = 0; i < inSize; i++) {
            let row = [];
            for (let j = 0; j < outSize; j++) row.push((Math.random() * 2 - 1) * Math.sqrt(2 / inSize));
            w.push(row);
        }
        return w;
    }
    sigmoid(x) { return 1 / (1 + Math.exp(-x)); }
    sigmoidDeriv(x) { return x * (1 - x); }
    resetContext() { this.context = new Array(this.hiddenSize).fill(0); }
    
    forward(inputs) {
        this.combinedInputs = inputs.concat(this.context);
        this.hidden = new Array(this.hiddenSize).fill(0);
        for (let i = 0; i < this.combinedInputs.length; i++) {
            for (let j = 0; j < this.hiddenSize; j++) this.hidden[j] += this.combinedInputs[i] * this.w1[i][j];
        }
        for (let j = 0; j < this.hiddenSize; j++) this.hidden[j] = this.sigmoid(this.hidden[j] + this.b1[j]);
        this.context = this.hidden.slice();
        
        this.outputs = new Array(this.outputSize).fill(0);
        for (let i = 0; i < this.hiddenSize; i++) {
            for (let j = 0; j < this.outputSize; j++) this.outputs[j] += this.hidden[i] * this.w2[i][j];
        }
        for (let j = 0; j < this.outputSize; j++) this.outputs[j] = this.sigmoid(this.outputs[j] + this.b2[j]);
        return this.outputs;
    }
    
    train(inputs, targets) {
        let outputs = this.forward(inputs);
        let outDeltas = [];
        for (let i = 0; i < this.outputSize; i++) {
            let err = targets[i] - outputs[i];
            outDeltas.push(err * this.sigmoidDeriv(outputs[i]));
        }
        let hiddenDeltas = new Array(this.hiddenSize).fill(0);
        for (let i = 0; i < this.hiddenSize; i++) {
            let err = 0;
            for (let j = 0; j < this.outputSize; j++) err += outDeltas[j] * this.w2[i][j];
            hiddenDeltas[i] = err * this.sigmoidDeriv(this.hidden[i]);
        }
        for (let i = 0; i < this.hiddenSize; i++) {
            for (let j = 0; j < this.outputSize; j++) this.w2[i][j] += this.learningRate * outDeltas[j] * this.hidden[i];
        }
        for (let j = 0; j < this.outputSize; j++) this.b2[j] += this.learningRate * outDeltas[j];
        for (let i = 0; i < this.combinedInputs.length; i++) {
            for (let j = 0; j < this.hiddenSize; j++) this.w1[i][j] += this.learningRate * hiddenDeltas[j] * this.combinedInputs[i];
        }
        for (let j = 0; j < this.hiddenSize; j++) this.b1[j] += this.learningRate * hiddenDeltas[j];
    }
}

// --- システム全体管理 ---
let chatHistory = []; 
let vocabChars = [];  
let responses = [];   
let aiModel = null;

// 初期知識
const seedData = [
    { user: "こんにちは", ai: "こんにちは！何かお手伝いしましょうか？" },
    { user: "ありがとう", ai: "どういたしまして！" },
    { user: "ばいばい", ai: "またいつでも話しかけてくださいね。" }
];

function textToVector(text) {
    let vec = new Array(vocabChars.length).fill(0);
    for (let char of text) {
        let idx = vocabChars.indexOf(char);
        if (idx !== -1) vec[idx] += 1;
    }
    return vec;
}

// モデルの再構築（学習データの増加に対応）
function rebuildAndTrainModel() {
    document.getElementById("statusText").innerText = "● 学習中...";
    
    vocabChars = []; responses = [];
    for (let data of chatHistory) {
        for (let char of data.user) if (!vocabChars.includes(char)) vocabChars.push(char);
        if (!responses.includes(data.ai)) responses.push(data.ai);
    }

    aiModel = new ChatRNN(vocabChars.length, 24, responses.length, 0.15);

    const epochs = 1000; 
    for (let e = 0; e < epochs; e++) {
        aiModel.resetContext();
        for (let data of chatHistory) {
            let inputVec = textToVector(data.user);
            let targetVec = new Array(responses.length).fill(0);
            targetVec[responses.indexOf(data.ai)] = 1; // 正解ラベル
            aiModel.train(inputVec, targetVec);
        }
    }
    document.getElementById("statusText").innerText = `● 待機中 (学習データ: ${chatHistory.length}件)`;
}

// --- UI 制御 ---
const chatWindow = document.getElementById("chatWindow");
const chatInput = document.getElementById("chatInput");

// メッセージと評価ボタンを表示する関数
function appendAIMessage(userText, aiText, isSeed = false) {
    const wrapper = document.createElement("div");
    wrapper.className = "msg-wrapper ai";
    
    const msgDiv = document.createElement("div");
    msgDiv.className = "message ai-msg";
    msgDiv.innerText = aiText;
    wrapper.appendChild(msgDiv);

    // シードの挨拶以外には評価ボタンを付ける
    if (!isSeed) {
        const actionDiv = document.createElement("div");
        actionDiv.className = "feedback-actions";
        
        const goodBtn = document.createElement("button");
        goodBtn.className = "feedback-btn"; goodBtn.innerText = "👍";
        
        const badBtn = document.createElement("button");
        badBtn.className = "feedback-btn"; badBtn.innerText = "👎";
        
        actionDiv.appendChild(goodBtn); actionDiv.appendChild(badBtn);
        
        // 👎を押した時の訂正入力フォーム
        const correctionDiv = document.createElement("div");
        correctionDiv.className = "correction-input";
        const cInput = document.createElement("input");
        cInput.type = "text"; cInput.placeholder = "どう返せばよかった？";
        const cBtn = document.createElement("button");
        cBtn.innerText = "教える";
        correctionDiv.appendChild(cInput); correctionDiv.appendChild(cBtn);

        // 👍ボタンの動作：この会話ペアを正式な記憶として強化
        goodBtn.onclick = () => {
            goodBtn.classList.add("active-good");
            badBtn.classList.remove("active-bad");
            correctionDiv.classList.remove("active");
            
            // 履歴に無ければ追加して再学習
            const exists = chatHistory.some(d => d.user === userText && d.ai === aiText);
            if (!exists) {
                chatHistory.push({ user: userText, ai: aiText });
                setTimeout(rebuildAndTrainModel, 10);
            }
        };

        // 👎ボタンの動作：学習を促すフォームを出す
        badBtn.onclick = () => {
            badBtn.classList.add("active-bad");
            goodBtn.classList.remove("active-good");
            correctionDiv.classList.add("active"); // 直下にサッと入力欄を出す
            cInput.focus();
        };

        // 訂正を送信
        cBtn.onclick = () => {
            const correctText = cInput.value.trim();
            if (correctText) {
                chatHistory.push({ user: userText, ai: correctText }); // 新しい正解を学習
                correctionDiv.innerHTML = "<span style='font-size:0.8em; color:#188038;'>学習しました！ありがとう✨</span>";
                setTimeout(rebuildAndTrainModel, 10);
            }
        };
        
        wrapper.appendChild(actionDiv);
        wrapper.appendChild(correctionDiv);
    }
    
    chatWindow.appendChild(wrapper);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

function appendUserMessage(text) {
    const wrapper = document.createElement("div");
    wrapper.className = "msg-wrapper user";
    const msgDiv = document.createElement("div");
    msgDiv.className = "message user-msg";
    msgDiv.innerText = text;
    wrapper.appendChild(msgDiv);
    chatWindow.appendChild(wrapper);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

document.getElementById("sendBtn").addEventListener("click", () => {
    const text = chatInput.value.trim();
    if (!text) return;
    
    appendUserMessage(text);
    chatInput.value = "";

    let inputVec = textToVector(text);
    
    // まだ知らない言葉のとき
    if (Math.max(...inputVec) === 0) {
        // AIが困っている返答を出し、ユーザーが👎を押して教えやすくする
        appendAIMessage(text, "すみません、その言葉はまだよく分かりません。");
        return;
    }

    // AIの推論
    let prediction = aiModel.forward(inputVec);
    let maxIdx = prediction.indexOf(Math.max(...prediction));
    const aiReply = responses[maxIdx];
    
    // AIの返答を表示（ここに👍👎ボタンが付きます）
    appendAIMessage(text, aiReply);
});

chatInput.addEventListener("keypress", (e) => { if (e.key === "Enter") document.getElementById("sendBtn").click(); });

// 起動時
window.onload = () => {
    chatHistory = [...seedData];
    rebuildAndTrainModel();
    appendAIMessage("", "こんにちは！チャットしながら学習します。良い返事には👍を、変な返事には👎を押して教えてください！", true);
};
</script>
</body>
</html>
