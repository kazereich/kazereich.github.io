
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft UUID Lookup</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#10131b;color:#e8eaf0;
  font-family:Arial,"Noto Sans JP",sans-serif;
}
.container{max-width:850px;margin:50px auto;padding:20px}
h1{text-align:center;font-size:27px}
.sub{text-align:center;color:#8993a5;margin-bottom:35px}
.search{
  display:flex;gap:10px;background:#1b2130;
  padding:15px;border-radius:12px;
}
input{
  flex:1;min-width:0;padding:13px;
  border:1px solid #353d50;border-radius:8px;
  background:#111722;color:white;font-size:15px;
}
button{
  border:0;border-radius:8px;padding:11px 16px;
  background:#3985ed;color:white;font-weight:bold;
  cursor:pointer;
}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.5;cursor:wait}
.card{
  background:#1b2130;border:1px solid #30394b;
  border-radius:13px;padding:20px;margin-top:20px;
}
.profile{display:flex;align-items:center;gap:20px}
.avatar{
  width:100px;height:100px;image-rendering:pixelated;
  background:#111722;border-radius:10px;
}
.name{font-size:25px;font-weight:bold;word-break:break-all}
.uuid{color:#929daf;font-size:13px;word-break:break-all;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.secondary{background:#343e52}
.section-title{font-size:17px;font-weight:bold;margin-bottom:15px}
.status{text-align:center;color:#aab4c5;margin-top:20px;line-height:1.7}
.error{color:#ff7777}
.note{font-size:12px;color:#8792a5;line-height:1.8}
.hidden{display:none}
.images{
  display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start;
}
.images>div{text-align:center}
.images img{
  object-fit:contain;background:#111722;
  border-radius:10px;padding:8px;
}
.small{font-size:12px;padding:8px 12px}
@media(max-width:550px){
  .container{margin:20px auto;padding:12px}
  .search{flex-direction:column}
  .profile{align-items:flex-start}
  .avatar{width:75px;height:75px}
  .name{font-size:20px}
}
</style>
</head>
<body>

<div class="container">

<h1>⛏ Minecraft UUID Lookup</h1>
<div class="sub">UUIDからプレイヤー情報・スキンを検索</div>

<div class="search">
  <input id="uuidInput" placeholder="Minecraft UUIDを入力">
  <button id="searchBtn" onclick="searchPlayer()">検索</button>
</div>

<div id="status" class="status">
UUIDを入力して検索してください。
</div>

<div id="result" class="hidden">

  <div class="card">
    <div class="profile">
      <img id="avatar" class="avatar" alt="Player Face">
      <div style="min-width:0">
        <div id="playerName" class="name"></div>
        <div id="playerUUID" class="uuid"></div>
      </div>
    </div>

    <div class="actions">
      <button onclick="copyText(currentUUID)">UUIDをコピー</button>
      <button class="secondary" onclick="copyText(currentUUID.replaceAll('-',''))">
        ハイフンなしUUID
      </button>
      <button class="secondary" onclick="copyText(currentName)">
        名前をコピー
      </button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">🖼 プレイヤー画像</div>

    <div class="images">
      <div>
        <img id="headImage" width="130" height="130" alt="Head">
        <div class="note">顔画像</div>
        <button class="small secondary" onclick="openImage('head')">
          画像を開く
        </button>
      </div>

      <div>
        <img id="bodyImage" width="130" height="190" alt="Body">
        <div class="note">全身画像</div>
        <button class="small secondary" onclick="openImage('body')">
          画像を開く
        </button>
      </div>
    </div>

    <div class="actions">
      <button class="secondary" onclick="copyText(headURL)">
        顔画像URLをコピー
      </button>
      <button class="secondary" onclick="copyText(bodyURL)">
        全身画像URLをコピー
      </button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">📋 プレイヤー情報</div>
    <div id="info" class="note"></div>
    <div class="actions">
      <button onclick="copyAll()">情報をすべてコピー</button>
    </div>
  </div>

</div>

<div class="card">
  <div class="section-title">使い方・注意事項</div>
  <div class="note">
    ・Java EditionのUUIDに対応しています。<br>
    ・現在のMinecraftプレイヤー名を取得します。<br>
    ・顔画像と全身画像はCrafatarから取得します。<br>
    ・過去の名前履歴は取得しません。<br>
    ・APIの停止や通信制限により検索できない場合があります。
  </div>
</div>

</div>

<script>
let currentUUID = "";
let currentName = "";
let headURL = "";
let bodyURL = "";

const $ = id => document.getElementById(id);

function normalizeUUID(value){
  return value.trim().replace(/-/g,"").toLowerCase();
}

function formatUUID(value){
  return value.replace(
    /^(.{8})(.{4})(.{4})(.{4})(.{12})$/,
    "$1-$2-$3-$4-$5"
  );
}

function setStatus(message,error=false){
  $("status").textContent=message;
  $("status").className=error?"status error":"status";
}

async function searchPlayer(){
  const uuid=normalizeUUID($("uuidInput").value);

  if(!/^[0-9a-f]{32}$/.test(uuid)){
    setStatus("UUIDの形式が正しくありません。",true);
    return;
  }

  $("searchBtn").disabled=true;
  $("result").classList.add("hidden");
  setStatus("プレイヤー情報を取得しています...");

  try{
    const url="https://playerdb.co/api/player/minecraft/"+encodeURIComponent(uuid);

    const response=await fetch(url);

    if(!response.ok){
      throw new Error("PlayerDB HTTP "+response.status);
    }

    const result=await response.json();

    if(result.code!=="player.found" || !result.data?.player){
      throw new Error(
        result.message || "プレイヤーが見つかりませんでした。"
      );
    }

    const player=result.data.player;

    currentName=player.username;
    currentUUID=formatUUID(normalizeUUID(player.id || uuid));

    if(!currentName){
      throw new Error("プレイヤー名が取得できませんでした。");
    }

    // 画像URL
    const imageId=normalizeUUID(currentUUID);

    headURL=
      "https://crafatar.com/avatars/"+imageId+
      "?size=256&overlay&default=404";

    bodyURL=
      "https://crafatar.com/renders/body/"+imageId+
      "?scale=6&overlay&default=404";

    const avatarURL=
      "https://crafatar.com/avatars/"+imageId+
      "?size=256&overlay&default=404";

    $("avatar").src=avatarURL;
    $("headImage").src=
      "https://crafatar.com/renders/head/"+imageId+
      "?scale=6&overlay&default=404";

    $("bodyImage").src=bodyURL;

    $("playerName").textContent=currentName;
    $("playerUUID").textContent=currentUUID;

    $("info").textContent=
      "プレイヤー名: "+currentName+
      "\nUUID: "+currentUUID;

    $("info").style.whiteSpace="pre-line";

    $("result").classList.remove("hidden");

    setStatus("取得完了！");

  }catch(error){
    console.error(error);

    setStatus(
      "取得エラー: "+error.message+
      "（通信環境・APIの状態を確認してください）",
      true
    );

  }finally{
    $("searchBtn").disabled=false;
  }
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(String(text));
    setStatus("コピーしました！");
  }catch(error){
    const area=document.createElement("textarea");
    area.value=String(text);
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    setStatus("コピーしました！");
  }
}

function copyAll(){
  copyText(
    "Minecraft Player Information\n"+
    "Name: "+currentName+"\n"+
    "UUID: "+currentUUID+"\n"+
    "Face Image: "+headURL+"\n"+
    "Body Image: "+bodyURL
  );
}

function openImage(type){
  const url=type==="head"?headURL:bodyURL;
  if(url)window.open(url,"_blank");
}

$("uuidInput").addEventListener("keydown",event=>{
  if(event.key==="Enter")searchPlayer();
});
</script>

</body>
</html>
