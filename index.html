<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Video Editor (YMM4 Clone)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .canvas-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
        canvas { max-width: 100%; max-height: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: grab; }
        canvas:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden flex flex-col">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const RESOLUTIONS = {
            "144p": { w: 256, h: 144 },
            "360p": { w: 640, h: 360 },
            "720p": { w: 1280, h: 720 },
            "1080p": { w: 1920, h: 1080 },
            "4K": { w: 3840, h: 2160 }
        };

        function App() {
            // プロジェクト設定
            const [settings, setSettings] = useState({
                res: "720p", width: 1280, height: 720, fps: 30, vBitrate: 2500000, aBitrate: 128000
            });
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);

            // タイムライン・レイヤー状態
            const [items, setItems] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            
            // 再生状態
            const [currentTime, setCurrentTime] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [playbackRate, setPlaybackRate] = useState(1.0);
            const [duration, setDuration] = useState(30); // デフォルト30秒

            // AI音声
            const [aiText, setAiText] = useState("");

            const canvasRef = useRef(null);
            const animationRef = useRef(null);
            const lastTimeRef = useRef(performance.now());
            const mediaRecorderRef = useRef(null);
            const [isRecording, setIsRecording] = useState(false);

            // キャンバス操作用
            const [isDragging, setIsDragging] = useState(false);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });

            // ----------------------------------------------------
            // キャンバス描画ループ
            // ----------------------------------------------------
            const renderCanvas = useCallback((timeNow) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                // 背景クリア
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, settings.width, settings.height);

                // アイテム描画
                const activeItems = items.filter(it => currentTime >= it.start && currentTime <= it.start + it.duration);
                
                // Zインデックス(レイヤー)順にソートして描画
                activeItems.sort((a, b) => a.layer - b.layer).forEach(item => {
                    ctx.save();
                    
                    // アニメーション(フェードイン例)
                    if (item.animation === "fade" && currentTime - item.start < 1) {
                        ctx.globalAlpha = currentTime - item.start;
                    }

                    if (item.type === 'text') {
                        ctx.font = `${item.fontSize}px ${item.fontFamily || 'sans-serif'}`;
                        ctx.fillStyle = item.color;
                        ctx.textBaseline = 'top';
                        // 縁取り
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = item.fontSize * 0.1;
                        ctx.strokeText(item.text, item.x, item.y);
                        ctx.fillText(item.text, item.x, item.y);

                        // 選択中の枠線
                        if (item.id === selectedId) {
                            const metrics = ctx.measureText(item.text);
                            ctx.strokeStyle = '#3b82f6'; // Blue
                            ctx.lineWidth = 2;
                            ctx.strokeRect(item.x - 5, item.y - 5, metrics.width + 10, item.fontSize + 10);
                        }
                    } else if (item.type === 'image' || item.type === 'video') {
                        if (item.element) {
                            // 動画の同期
                            if (item.type === 'video') {
                                const videoTime = (currentTime - item.start) + (item.offset || 0);
                                // 誤差が大きければシーク
                                if (Math.abs(item.element.currentTime - videoTime) > 0.1) {
                                    item.element.currentTime = videoTime;
                                }
                                if (isPlaying && item.element.paused) item.element.play();
                                else if (!isPlaying && !item.element.paused) item.element.pause();
                            }
                            
                            ctx.drawImage(item.element, item.x, item.y, item.width, item.height);
                            
                            if (item.id === selectedId) {
                                ctx.strokeStyle = '#3b82f6';
                                ctx.lineWidth = 4;
                                ctx.strokeRect(item.x, item.y, item.width, item.height);
                            }
                        }
                    }
                    ctx.restore();
                });
            }, [items, currentTime, settings, selectedId, isPlaying]);

            // ループ処理
            useEffect(() => {
                const loop = (now) => {
                    const delta = (now - lastTimeRef.current) / 1000;
                    lastTimeRef.current = now;

                    if (isPlaying) {
                        setCurrentTime(prev => {
                            const next = prev + delta * playbackRate;
                            if (next >= duration) {
                                setIsPlaying(false);
                                return duration;
                            }
                            return next;
                        });
                    }
                    renderCanvas(now);
                    animationRef.current = requestAnimationFrame(loop);
                };
                animationRef.current = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(animationRef.current);
            }, [isPlaying, playbackRate, duration, renderCanvas]);


            // ----------------------------------------------------
            // キャンバス上の直接操作（ドラッグ＆ドロップ）
            // ----------------------------------------------------
            const handleCanvasMouseDown = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = settings.width / rect.width;
                const scaleY = settings.height / rect.height;
                const clickX = (e.clientX - rect.left) * scaleX;
                const clickY = (e.clientY - rect.top) * scaleY;

                // クリック位置にあるアイテムを探す（前面=配列の後ろ から）
                const activeItems = items.filter(it => currentTime >= it.start && currentTime <= it.start + it.duration);
                let clickedItem = null;
                
                for (let i = activeItems.length - 1; i >= 0; i--) {
                    const item = activeItems[i];
                    let isHit = false;
                    if (item.type === 'text') {
                        const ctx = canvas.getContext('2d');
                        ctx.font = `${item.fontSize}px sans-serif`;
                        const metrics = ctx.measureText(item.text);
                        isHit = (clickX >= item.x && clickX <= item.x + metrics.width &&
                                 clickY >= item.y && clickY <= item.y + item.fontSize);
                    } else if (item.type === 'image' || item.type === 'video') {
                        isHit = (clickX >= item.x && clickX <= item.x + item.width &&
                                 clickY >= item.y && clickY <= item.y + item.height);
                    }
                    
                    if (isHit) {
                        clickedItem = item;
                        break;
                    }
                }

                if (clickedItem) {
                    setSelectedId(clickedItem.id);
                    setIsDragging(true);
                    setDragOffset({ x: clickX - clickedItem.x, y: clickY - clickedItem.y });
                } else {
                    setSelectedId(null);
                }
            };

            const handleCanvasMouseMove = (e) => {
                if (!isDragging || !selectedId) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = settings.width / rect.width;
                const scaleY = settings.height / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;

                setItems(prev => prev.map(item => 
                    item.id === selectedId 
                    ? { ...item, x: mouseX - dragOffset.x, y: mouseY - dragOffset.y } 
                    : item
                ));
            };

            const handleCanvasMouseUp = () => setIsDragging(false);

            // ----------------------------------------------------
            // メディア追加機能
            // ----------------------------------------------------
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const url = URL.createObjectURL(file);
                const isVideo = file.type.startsWith('video');

                const newItem = {
                    id: Date.now().toString(),
                    type: isVideo ? 'video' : 'image',
                    name: file.name,
                    src: url,
                    start: currentTime,
                    duration: 5,
                    layer: 1,
                    x: settings.width / 4,
                    y: settings.height / 4,
                    width: settings.width / 2,
                    height: settings.height / 2,
                    animation: "none"
                };

                if (isVideo) {
                    const video = document.createElement('video');
                    video.src = url;
                    video.muted = true; // キャンバス描画用
                    video.onloadedmetadata = () => {
                        newItem.duration = video.duration;
                        newItem.element = video;
                        setItems(prev => [...prev, newItem]);
                    };
                } else {
                    const img = new Image();
                    img.src = url;
                    img.onload = () => {
                        newItem.element = img;
                        setItems(prev => [...prev, newItem]);
                    };
                }
            };

            const addText = () => {
                setItems(prev => [...prev, {
                    id: Date.now().toString(),
                    type: 'text',
                    name: '新規テキスト',
                    text: 'テキストを入力',
                    start: currentTime,
                    duration: 5,
                    layer: 2,
                    x: settings.width / 2 - 100,
                    y: settings.height / 2,
                    fontSize: 60,
                    color: '#ffffff',
                    fontFamily: 'sans-serif',
                    animation: "none"
                }]);
            };

            // ----------------------------------------------------
            // AI音声生成 (VOICEVOX フォールバック: Web Speech API)
            // ----------------------------------------------------
            const generateAIVoice = async () => {
                if (!aiText.trim()) return;
                
                try {
                    // VOICEVOXローカルホストへのリクエスト試行
                    const queryRes = await fetch(`http://127.0.0.1:50021/audio_query?text=${encodeURIComponent(aiText)}&speaker=1`, { method: 'POST' });
                    const queryJson = await queryRes.json();
                    const synthRes = await fetch(`http://127.0.0.1:50021/synthesis?speaker=1`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(queryJson)
                    });
                    const blob = await synthRes.blob();
                    const url = URL.createObjectURL(blob);
                    
                    const audio = new Audio(url);
                    audio.onloadedmetadata = () => {
                        // 音声アイテム追加
                        setItems(prev => [...prev, {
                            id: Date.now().toString() + "a",
                            type: 'audio',
                            name: 'AI音声',
                            src: url,
                            element: audio,
                            start: currentTime,
                            duration: audio.duration,
                            layer: 0
                        }]);
                    };
                } catch (e) {
                    console.warn("VOICEVOX未起動。Web Speech APIを使用します。");
                    // ブラウザ標準の読み上げ機能
                    const utterance = new SpeechSynthesisUtterance(aiText);
                    utterance.lang = 'ja-JP';
                    window.speechSynthesis.speak(utterance);
                    // ダミー持続時間を設定（正確には取得できないため推定）
                    const estimatedDuration = aiText.length * 0.2; 
                    setItems(prev => [...prev, {
                        id: Date.now().toString() + "a",
                        type: 'audio',
                        name: 'AI音声(ブラウザ)',
                        start: currentTime,
                        duration: estimatedDuration,
                        layer: 0
                    }]);
                }

                // 同時に字幕テキストを配置
                setItems(prev => [...prev, {
                    id: Date.now().toString() + "t",
                    type: 'text',
                    name: '字幕',
                    text: aiText,
                    start: currentTime,
                    duration: aiText.length * 0.2 || 2, // 目安
                    layer: 3,
                    x: settings.width / 2 - (aiText.length * 15),
                    y: settings.height - 100,
                    fontSize: 50,
                    color: '#ffffff',
                    fontFamily: 'sans-serif',
                    animation: "fade"
                }]);
                setAiText("");
            };

            // ----------------------------------------------------
            // エクスポート (MediaRecorder API)
            // ----------------------------------------------------
            const exportVideo = () => {
                if (!canvasRef.current) return;
                setIsRecording(true);
                setCurrentTime(0);
                setIsPlaying(true);

                const stream = canvasRef.current.captureStream(settings.fps);
                // ※音声ストリームの合成処理（AudioContext等）は複雑化するため本コードでは映像のみを記録
                
                const recorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm; codecs=vp9',
                    videoBitsPerSecond: settings.vBitrate
                });
                
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `export_${settings.res}.webm`;
                    a.click();
                    setIsRecording(false);
                    setIsPlaying(false);
                };
                
                recorder.start();
                mediaRecorderRef.current = recorder;

                // duration到達でストップする監視タイマー
                const checkEnd = setInterval(() => {
                    setCurrentTime(curr => {
                        if (curr >= duration - 0.1) {
                            recorder.stop();
                            clearInterval(checkEnd);
                        }
                        return curr;
                    });
                }, 500);
            };

            const selectedItem = items.find(it => it.id === selectedId);

            return (
                <div className="flex flex-col h-full bg-gray-900 font-sans">
                    {/* ヘッダーバー */}
                    <div className="bg-gray-800 p-2 flex justify-between items-center border-b border-gray-700 shadow-sm">
                        <div className="flex items-center space-x-4">
                            <h1 className="text-lg font-bold text-blue-400"><i className="fa-solid fa-clapperboard mr-2"></i>Web Video Editor</h1>
                            <div className="flex space-x-2">
                                <label className="cursor-pointer bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm transition">
                                    <i className="fa-solid fa-file-import mr-1"></i> メディア
                                    <input type="file" className="hidden" accept="image/*,video/*" onChange={handleFileUpload} />
                                </label>
                                <button onClick={addText} className="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm transition">
                                    <i className="fa-solid fa-font mr-1"></i> テキスト
                                </button>
                                <button onClick={() => setIsSettingsOpen(true)} className="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm transition">
                                    <i className="fa-solid fa-gear mr-1"></i> 設定
                                </button>
                            </div>
                        </div>
                        <div>
                            <button onClick={exportVideo} disabled={isRecording} className={`px-4 py-1.5 rounded font-bold transition ${isRecording ? 'bg-red-600 animate-pulse' : 'bg-blue-600 hover:bg-blue-500'}`}>
                                {isRecording ? '録画中...' : '動画書き出し'}
                            </button>
                        </div>
                    </div>

                    {/* メインワークスペース */}
                    <div className="flex flex-1 overflow-hidden">
                        
                        {/* 左/中央：プレビュー画面 */}
                        <div className="flex-1 flex flex-col p-4 bg-gray-950 relative">
                            {/* AI音声パネル */}
                            <div className="absolute top-6 left-6 z-10 bg-gray-800/80 p-3 rounded-lg backdrop-blur shadow-lg w-80">
                                <h3 className="text-sm font-bold mb-2 text-gray-300"><i className="fa-solid fa-robot mr-1"></i> AI音声・自動字幕追加</h3>
                                <div className="flex space-x-2">
                                    <input 
                                        type="text" 
                                        value={aiText} 
                                        onChange={(e) => setAiText(e.target.value)} 
                                        placeholder="喋らせる内容を入力..." 
                                        className="flex-1 bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500"
                                    />
                                    <button onClick={generateAIVoice} className="bg-green-600 hover:bg-green-500 px-3 py-1 rounded text-sm transition">追加</button>
                                </div>
                                <p className="text-xs text-gray-500 mt-2">※ローカルでVOICEVOX起動中なら連携します</p>
                            </div>

                            {/* キャンバス */}
                            <div className="canvas-container rounded-lg border border-gray-700">
                                <canvas
                                    ref={canvasRef}
                                    width={settings.width}
                                    height={settings.height}
                                    onMouseDown={handleCanvasMouseDown}
                                    onMouseMove={handleCanvasMouseMove}
                                    onMouseUp={handleCanvasMouseUp}
                                    onMouseLeave={handleCanvasMouseUp}
                                ></canvas>
                            </div>

                            {/* コントローラー */}
                            <div className="mt-4 flex items-center justify-center space-x-6 bg-gray-800 p-2 rounded-full w-max mx-auto shadow-lg border border-gray-700">
                                <span className="text-sm font-mono w-16 text-center">{currentTime.toFixed(2)}s</span>
                                <button onClick={() => setCurrentTime(0)} className="hover:text-blue-400 transition"><i className="fa-solid fa-backward-step"></i></button>
                                <button onClick={() => setIsPlaying(!isPlaying)} className="w-10 h-10 bg-blue-600 hover:bg-blue-500 rounded-full flex items-center justify-center text-xl transition shadow">
                                    <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'}`}></i>
                                </button>
                                <button onClick={() => setIsPlaying(false)} className="hover:text-red-400 transition"><i className="fa-solid fa-stop"></i></button>
                                
                                <div className="flex items-center space-x-2 text-sm border-l border-gray-600 pl-4">
                                    <span>速度:</span>
                                    <select value={playbackRate} onChange={(e) => setPlaybackRate(Number(e.target.value))} className="bg-gray-700 rounded p-1 outline-none">
                                        <option value="0.25">0.25x</option>
                                        <option value="0.5">0.5x</option>
                                        <option value="1">1.0x</option>
                                        <option value="1.5">1.5x</option>
                                        <option value="2">2.0x</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* 右：プロパティ（インスペクタ）パネル */}
                        <div className="w-80 bg-gray-800 border-l border-gray-700 flex flex-col">
                            <div className="p-3 bg-gray-900 border-b border-gray-700 font-bold text-sm">
                                設定 / プロパティ
                            </div>
                            <div className="p-4 flex-1 overflow-y-auto space-y-4 text-sm">
                                {selectedItem ? (
                                    <>
                                        <div>
                                            <label className="block text-gray-400 mb-1">X位置</label>
                                            <input type="number" value={Math.round(selectedItem.x || 0)} 
                                                onChange={(e) => setItems(items.map(it => it.id === selectedId ? {...it, x: Number(e.target.value)} : it))}
                                                className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 focus:border-blue-500 outline-none"/>
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 mb-1">Y位置</label>
                                            <input type="number" value={Math.round(selectedItem.y || 0)} 
                                                onChange={(e) => setItems(items.map(it => it.id === selectedId ? {...it, y: Number(e.target.value)} : it))}
                                                className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 focus:border-blue-500 outline-none"/>
                                        </div>
                                        
                                        {selectedItem.type === 'text' && (
                                            <>
                                                <div>
                                                    <label className="block text-gray-400 mb-1">テキスト内容</label>
                                                    <textarea value={selectedItem.text} 
                                                        onChange={(e) => setItems(items.map(it => it.id === selectedId ? {...it, text: e.target.value} : it))}
                                                        className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 h-20 focus:border-blue-500 outline-none"></textarea>
                                                </div>
                                                <div>
                                                    <label className="block text-gray-400 mb-1">フォントサイズ</label>
                                                    <input type="range" min="10" max="200" value={selectedItem.fontSize} 
                                                        onChange={(e) => setItems(items.map(it => it.id === selectedId ? {...it, fontSize: Number(e.target.value)} : it))}
                                                        className="w-full accent-blue-500"/>
                                                </div>
                                                <div>
                                                    <label className="block text-gray-400 mb-1">文字色</label>
                                                    <input type="color" value={selectedItem.color} 
                                                        onChange={(e) => setItems(items.map(it => it.id === selectedId ? {...it, color: e.target.value} : it))}
                                                        className="w-full h-8 cursor-pointer rounded bg-transparent border-0"/>
                                                </div>
                                            </>
                                        )}
                                        
                                        {['image', 'video'].includes(selectedItem.type) && (
                                            <>
                                                <div>
                                                    <label className="block text-gray-400 mb-1">幅 (Width)</label>
                                                    <input type="number" value={Math.round(selectedItem.width)} 
                                                        onChange={(e) => setItems(items.map(it => it.id === selectedId ? {...it, width: Number(e.target.value)} : it))}
                                                        className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 focus:border-blue-500 outline-none"/>
                                                </div>
                                                <div>
                                                    <label className="block text-gray-400 mb-1">高さ (Height)</label>
                                                    <input type="number" value={Math.round(selectedItem.height)} 
                                                        onChange={(e) => setItems(items.map(it => it.id === selectedId ? {...it, height: Number(e.target.value)} : it))}
                                                        className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 focus:border-blue-500 outline-none"/>
                                                </div>
                                            </>
                                        )}

                                        <div>
                                            <label className="block text-gray-400 mb-1">アニメーション</label>
                                            <select value={selectedItem.animation || "none"} 
                                                onChange={(e) => setItems(items.map(it => it.id === selectedId ? {...it, animation: e.target.value} : it))}
                                                className="w-full bg-gray-900 border border-gray-700 rounded p-1.5 focus:border-blue-500 outline-none">
                                                <option value="none">なし</option>
                                                <option value="fade">フェードイン</option>
                                            </select>
                                        </div>

                                        <button onClick={() => {
                                            setItems(items.filter(it => it.id !== selectedId));
                                            setSelectedId(null);
                                        }} className="w-full bg-red-600 hover:bg-red-500 py-2 rounded mt-4 transition">
                                            <i className="fa-solid fa-trash mr-1"></i> 削除
                                        </button>
                                    </>
                                ) : (
                                    <div className="text-gray-500 text-center mt-10">
                                        アイテムを選択してください<br/>
                                        (キャンバス上 または タイムライン)
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* 下部：タイムライン */}
                    <div className="h-64 bg-gray-800 border-t border-gray-700 flex flex-col select-none">
                        <div className="flex bg-gray-900 border-b border-gray-700 px-4 py-1 text-xs text-gray-400 items-center justify-between">
                            <span>タイムライン</span>
                            <div className="flex items-center space-x-2">
                                <span>全長:</span>
                                <input type="number" value={duration} onChange={e => setDuration(Number(e.target.value))} className="w-16 bg-gray-700 text-white rounded px-1 outline-none"/>
                                <span>秒</span>
                            </div>
                        </div>
                        
                        <div className="flex-1 overflow-auto relative p-2" 
                             onMouseDown={(e) => {
                                 // タイムラインクリックでシーク
                                 if (e.target === e.currentTarget) {
                                    const rect = e.currentTarget.getBoundingClientRect();
                                    const clickX = e.clientX - rect.left;
                                    const newTime = (clickX / 2000) * duration; // 2000px をタイムライン全幅と仮定
                                    setCurrentTime(Math.max(0, Math.min(newTime, duration)));
                                 }
                             }}>
                            
                            <div className="relative" style={{ width: '2000px', height: '100%' }}>
                                {/* ルーラー (目盛り) */}
                                <div className="h-6 border-b border-gray-700 mb-2 relative pointer-events-none">
                                    {[...Array(Math.ceil(duration) + 1)].map((_, i) => (
                                        <div key={i} className="absolute text-[10px] text-gray-500 border-l border-gray-600 pl-1" style={{ left: `${(i / duration) * 100}%` }}>
                                            {i}s
                                        </div>
                                    ))}
                                </div>

                                {/* レイヤー表示 */}
                                {[0, 1, 2, 3].map(layerNum => (
                                    <div key={layerNum} className="h-10 bg-gray-900/50 mb-1 rounded relative border border-gray-700/50">
                                        <div className="absolute left-0 top-0 bottom-0 w-16 bg-gray-900 border-r border-gray-700 flex items-center justify-center text-xs text-gray-500 z-10 pointer-events-none">
                                            Layer {layerNum}
                                        </div>
                                        {items.filter(it => it.layer === layerNum).map(item => (
                                            <div key={item.id} 
                                                 onMouseDown={(e) => { e.stopPropagation(); setSelectedId(item.id); }}
                                                 className={`absolute top-1 bottom-1 rounded border overflow-hidden cursor-pointer text-xs px-2 flex items-center shadow ${
                                                     item.id === selectedId ? 'bg-blue-600 border-blue-400' : 
                                                     item.type === 'text' ? 'bg-green-700 border-green-500' :
                                                     item.type === 'audio' ? 'bg-purple-700 border-purple-500' :
                                                     'bg-orange-700 border-orange-500'
                                                 }`}
                                                 style={{
                                                     left: `calc(4rem + ${(item.start / duration) * 100}%)`,
                                                     width: `${(item.duration / duration) * 100}%`
                                                 }}>
                                                 <span className="truncate">{item.name || item.text}</span>
                                            </div>
                                        ))}
                                    </div>
                                ))}

                                {/* 再生ヘッド（赤い線） */}
                                <div className="absolute top-0 bottom-0 w-[2px] bg-red-500 pointer-events-none z-20"
                                     style={{ left: `calc(4rem + ${(currentTime / duration) * 100}%)` }}>
                                     <div className="absolute -top-2 -ml-[5px] w-0 h-0 border-l-[6px] border-r-[6px] border-t-[8px] border-transparent border-t-red-500"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 設定モーダル */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
                            <div className="bg-gray-800 p-6 rounded-lg shadow-xl w-96 border border-gray-700">
                                <h2 className="text-lg font-bold mb-4 border-b border-gray-700 pb-2">プロジェクト設定</h2>
                                
                                <div className="space-y-4 text-sm">
                                    <div>
                                        <label className="block text-gray-400 mb-1">解像度プリセット</label>
                                        <select 
                                            value={settings.res}
                                            onChange={(e) => {
                                                const res = e.target.value;
                                                setSettings({...settings, res, width: RESOLUTIONS[res].w, height: RESOLUTIONS[res].h});
                                            }}
                                            className="w-full bg-gray-900 border border-gray-700 rounded p-2 focus:border-blue-500 outline-none">
                                            {Object.keys(RESOLUTIONS).map(r => <option key={r} value={r}>{r} ({RESOLUTIONS[r].w}x{RESOLUTIONS[r].h})</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-gray-400 mb-1">フレームレート (fps)</label>
                                        <input type="number" value={settings.fps} onChange={e => setSettings({...settings, fps: Number(e.target.value)})} className="w-full bg-gray-900 border border-gray-700 rounded p-2 outline-none"/>
                                    </div>
                                    <div>
                                        <label className="block text-gray-400 mb-1">映像ビットレート (bps)</label>
                                        <input type="number" value={settings.vBitrate} onChange={e => setSettings({...settings, vBitrate: Number(e.target.value)})} className="w-full bg-gray-900 border border-gray-700 rounded p-2 outline-none"/>
                                    </div>
                                </div>
                                
                                <div className="mt-6 flex justify-end">
                                    <button onClick={() => setIsSettingsOpen(false)} className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-bold transition">閉じる / 適用</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
